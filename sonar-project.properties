sonar.projectKey=agily
sonar.projectName=Agily
sonar.sourceEncoding=UTF-8

sonar.sources=src,packages/lens/src
sonar.tests=src,packages/lens/src
sonar.test.inclusions=**/*.test.ts

sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/prisma/**,apps/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=**/*.test.ts,src/app/**,src/components/**,src/lib/db/**,src/lib/auth/session.ts,src/lib/notices/write.ts,src/lib/items/actions.ts,src/lib/items/queries.ts,src/lib/items/create.ts,src/lib/teams/**,src/lib/projects/**,src/lib/data/actions.ts

# CI: set repository variable SONAR_ENABLED=true and secrets SONAR_TOKEN + SONAR_HOST_URL
# (SonarCloud: use https://sonarcloud.io as SONAR_HOST_URL and add sonar.organization below)
# sonar.organization=your-org
